services:
  network-guard:
    container_name: aquila-network-guard
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Restringir exposição de DNS e painel à interface interna segura
      - "${PIHOLE_BIND_IP:-127.0.0.1}:53:53/tcp"
      - "${PIHOLE_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${PIHOLE_BIND_IP:-127.0.0.1}:8082:80/tcp"
    environment:
      TZ: 'America/Sao_Paulo'
      WEBPASSWORD: "${PIHOLE_WEBPASSWORD}"
      INTERFACE: 'eth0'
    volumes:
      - './config/etc-pihole:/etc/pihole'
      - './config/etc-dnsmasq.d:/etc/dnsmasq.d'
    dns:
      - 127.0.0.1
      - 1.1.1.3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
