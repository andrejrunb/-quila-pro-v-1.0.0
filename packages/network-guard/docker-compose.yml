version: '3.8'

services:
  network-guard:
    container_name: aquila-network-guard
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:80/tcp" # Porta web do Admin Panel mapeada fora da porta 80 do host
    environment:
      TZ: 'America/Sao_Paulo'
      WEBPASSWORD: 'Admin@2026!'
      INTERFACE: 'eth0'
    volumes:
      - './config/etc-pihole:/etc/pihole'
      - './config/etc-dnsmasq.d:/etc/dnsmasq.d'
    dns:
      - 127.0.0.1
      - 1.1.1.3
    cap_add:
      - NET_ADMIN # Necessário para capacidades DHCP e controle ARP
    restart: unless-stopped
