{% extends 'base.html' %}

{% block title %}Login - Áquila{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0"><i class="bi bi-eye"></i> Áquila</h4>
            <p class="mb-0">Sistema de Monitoramento Escolar</p>
        </div>
        <div class="card-body">
            <h5 class="card-title text-center mb-4">Login</h5>
            <form method="post" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Lembrar de mim</label>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none">Esqueceu a senha?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
