<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Relatórios</title></head>
  <body>
    <h1>Relatórios</h1>
    <ul>
      {% for r in reports %}
        <li>
          {{ r.report_name }} ({{ r.created_at }})
          - <a href="{{ url_for('reports.download', report_id=r.id) }}">Abrir</a>
          <form action="{{ url_for('reports.delete', report_id=r.id) }}" method="post" style="display:inline;">
            <button type="submit">Excluir</button>
          </form>
        </li>
      {% else %}
        <li>Nenhum relatório.</li>
      {% endfor %}
    </ul>
  </body>
</html>
