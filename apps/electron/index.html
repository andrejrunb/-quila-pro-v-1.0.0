<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: file: https://i.ytimg.com https://img.youtube.com https://avatars.githubusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws://localhost:9000 http://localhost:9000 http://localhost:3001 https://www.googleapis.com https://youtube.googleapis.com;" />
  <title>Áquila Pro - Sistema de Segurança e Engajamento Escolar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f7fa;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    /* Loading Screen */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .loading-screen h1 {
      font-size: 32px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-screen p {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <h1>Áquila Pro</h1>
      <div class="spinner"></div>
      <p>Iniciando aplicativo...</p>
    </div>
  </div>
  <script>
    console.log("Renderer: HTML carregado, iniciando scripts...");
    window.onerror = function(msg, url, line, col, error) {
      var errorMsg = "ERRO NO RENDERER:\n" + msg + "\nURL: " + url + "\nLinha: " + line;
      console.error(errorMsg, error);
      // alert(errorMsg);
    };
  </script>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
