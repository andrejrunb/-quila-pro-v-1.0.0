version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Evolution API — WhatsApp Self-Hosted Bridge for Áquila Pro
#
# Como usar:
#   1. Copie e ajuste as variáveis abaixo (ou crie um .env)
#   2. docker-compose -f docker-compose.evolution.yml up -d
#   3. Acesse http://localhost:8080/manager
#   4. Crie a instância "aquilapro" e escaneie o QR Code
#   5. Configure o webhook para apontar para seu servidor:
#      http://SEU_IP_OU_DOMINIO/whatsapp/webhook
# ─────────────────────────────────────────────────────────────────────────────

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api-aquila
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # URL pública onde ESTE container está acessível (para webhooks internos)
      SERVER_URL: "${EVOLUTION_SERVER_URL:-http://localhost:8080}"

      # Chave de autenticação global — use a mesma em EVOLUTION_API_KEY do .env do aquila-cloud
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-aquila-evolution-key-change-me}"

      # Webhook global: URL do aquila-cloud que vai receber mensagens do WhatsApp
      WEBHOOK_GLOBAL_URL: "${AQUILA_CLOUD_URL:-http://localhost:3000}/whatsapp/webhook"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # Eventos que queremos receber (mensagens recebidas)
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # Banco de dados interno da Evolution API
      DATABASE_ENABLED: "false"
      DATABASE_PROVIDER: "postgresql"

      # Cache Redis (opcional — desabilite se não tiver Redis)
      CACHE_REDIS_ENABLED: "false"

      # Log level
      LOG_LEVEL: "ERROR"

    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
    name: aquila_evolution_instances
