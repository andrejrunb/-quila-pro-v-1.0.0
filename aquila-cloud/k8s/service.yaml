apiVersion: v1
kind: Service
metadata:
  name: aquila-cloud-svc
  namespace: aquila-v3
spec:
  type: LoadBalancer
  selector:
    app: aquila-cloud
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aquila-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.aquila.school
    secretName: aq-tls-secret
  rules:
  - host: api.aquila.school
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aquila-cloud-svc
            port:
              number: 80
