apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquila-cloud-api
  namespace: aquila-v3
  labels:
    app: aquila-cloud
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aquila-cloud
  template:
    metadata:
      labels:
        app: aquila-cloud
    spec:
      containers:
      - name: aquila-api
        image: gcr.io/aquila-pro/cloud-api:v3.1.0
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: aq-db-secrets
              key: host
        resources:
          limits:
            cpu: "500m"
            memory: "1024Mi"
          requests:
            cpu: "200m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aquila-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aquila-cloud-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
