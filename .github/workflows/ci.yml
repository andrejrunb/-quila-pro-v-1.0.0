name: Áquila Pro Sovereign CI

on:
  push:
    branches: [main, master, "integration/**"]
  pull_request:
    branches: [main, master, "integration/**"]

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint Web Portal (@aquila/web)
        run: pnpm --filter @aquila/web run lint

      - name: Typecheck Web Portal & Shared API (tsc --noEmit)
        run: |
          pnpm --filter @aquila/web exec tsc --noEmit
          pnpm --filter @aquila/api exec tsc --noEmit

      - name: Unit Tests — Web Portal (@aquila/web)
        run: pnpm --filter @aquila/web run test

      - name: Unit Tests — Shared API (@aquila/api)
        run: pnpm --filter @aquila/api run test

      - name: H-01 Collector & Mission Verification
        run: |
          python3 scripts/h01/test_collector_10_fixtures.py
          python3 scripts/colab_harness/test_colab_harness.py
          node scripts/h01/test_pp_mission_verification.cjs
