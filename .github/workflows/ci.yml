name: 🦅 Áquila Pro — Sovereign Monorepo CI/CD

on:
  push:
    branches: [main, clean-release-v1, andrejrunb-aquila-notebook-hardening]
  pull_request:
    branches: [main, clean-release-v1]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Security & Secrets Scan
  # ──────────────────────────────────────────
  security-audit:
    name: 🛡️ Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Leaked Secrets
        run: |
          echo "Scanning for plaintext credentials and raw keys..."
          ! git grep -E "(s[k]_live_|AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36})" -- ':!*.example' ':!*.md' ':!colab/*.ipynb' ':!scripts/protect_branches.py'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Dependency Vulnerability Audit Report
        run: |
          echo "Auditing dependencies..."
          pnpm audit --audit-level=high

  # ──────────────────────────────────────────
  # JOB 2: Aquila Notebook Hardening Tests
  # ──────────────────────────────────────────
  aquila-notebook-tests:
    name: 🐍 Aquila Notebook Hardening Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API test harness dependencies
        run: python -m pip install "fastapi>=0.110,<1" "httpx>=0.27,<1"

      - name: Run Aquila notebook hardening tests
        run: python -m unittest -v test_aquila_hardening
        working-directory: colab

  # ──────────────────────────────────────────
  # JOB 3: Monorepo Type Check & Lint
  # ──────────────────────────────────────────
  typecheck-and-lint:
    name: 🔍 TypeScript Strict Check & ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Web TypeScript Strict Check
        run: pnpm --filter @aquila/web exec tsc --noEmit

      - name: Mobile TypeScript Strict Check
        run: pnpm --filter aquila-pro-mobile exec tsc --noEmit

  # ──────────────────────────────────────────
  # JOB 4: Unit Tests, Security & LGPD Integrity
  # ──────────────────────────────────────────
  test:
    name: 🧪 Automated Test Suite & LGPD Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Web Crypto HMAC-SHA256 Security Suite
        run: pnpm dlx tsx scripts/test_session_security.ts

      - name: Run LGPD Student Rights Test Suite (Art. 14, 16, 18)
        run: pnpm dlx tsx scripts/test_lgpd_rights.ts

      - name: Run OMR Calibration & Accuracy Benchmark
        run: pnpm dlx tsx scripts/test_omr_calibration.ts

      - name: Run SQLite Edge Backup & DR Security Suite
        run: node scripts/test_backup_dr_suite.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/apps/electron/node_modules

      - name: Run E2E Critical Operational Flows Suite
        if: ${{ always() }}
        run: node scripts/test_e2e_critical_flow.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/apps/electron/node_modules

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            docs/architecture/omr_calibration_report.md
            apps/electron/e2e/results.json
            test-results/e2e-critical-report.json
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # JOB 5: Monorepo Build Verification
  # ──────────────────────────────────────────
  build:
    name: 🏗️ Production Build Verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web SaaS & Electron Renderer
        run: |
          pnpm --filter @aquila/web run build
          pnpm --filter aquila-pro-school-os run build:renderer
        env:
          NODE_ENV: production

  # ──────────────────────────────────────────
  # JOB 6: Required Release Gate
  # ──────────────────────────────────────────
  release-gate:
    name: 🚦 Required Release Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - security-audit
      - aquila-notebook-tests
      - typecheck-and-lint
      - test
      - build
    steps:
      - name: Require all verification jobs to pass
        env:
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
          AQUILA_NOTEBOOK_TESTS_RESULT: ${{ needs.aquila-notebook-tests.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck-and-lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failed=0
          for job_result in \
            "$SECURITY_AUDIT_RESULT" \
            "$AQUILA_NOTEBOOK_TESTS_RESULT" \
            "$TYPECHECK_RESULT" \
            "$TEST_RESULT" \
            "$BUILD_RESULT"; do
            if [ "$job_result" != "success" ]; then
              echo "Required verification did not pass: $job_result"
              failed=1
            fi
          done
          exit "$failed"
