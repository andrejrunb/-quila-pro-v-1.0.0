name: 🦅 Áquila Pro — Sovereign Monorepo CI/CD

on:
  push:
    branches: [main, clean-release-v1]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Security & Secrets Scan
  # ──────────────────────────────────────────
  security-audit:
    name: 🛡️ Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Leaked Secrets
        run: |
          echo "Scanning for plaintext credentials and raw keys..."
          # Reject any tracked files with real JWT secrets or private keys
          ! git grep -E "(sk_live_|AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36})" -- ':!*.example' ':!*.md' ':!colab/*'

  # ──────────────────────────────────────────
  # JOB 2: Monorepo Type Check & Lint
  # ──────────────────────────────────────────
  typecheck-and-lint:
    name: 🔍 TypeScript Strict Check & ESLint
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Mobile TypeScript Strict Check
        run: pnpm --filter aquila-pro-mobile exec tsc --noEmit

  # ──────────────────────────────────────────
  # JOB 3: Unit Tests & LGPD Coverage
  # ──────────────────────────────────────────
  test:
    name: 🧪 Automated Test Suite & LGPD Integrity
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Web Vitest Suite
        run: pnpm --filter @aquila/web run test
        env:
          CI: true

      - name: Run Electron Critical Test Suites
        run: pnpm --filter aquila-pro-school-os run test src/database/__tests__/Database512AndOmr.test.ts src/main/services/__tests__/OmrCorrectionService.test.ts src/main/services/__tests__/CourtyardTelemetryService.test.ts
        env:
          CI: true

  # ──────────────────────────────────────────
  # JOB 4: Monorepo Build Verification
  # ──────────────────────────────────────────
  build:
    name: 🏗️ Production Build Verification
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web SaaS & Electron Renderer
        run: |
          pnpm --filter @aquila/web run build
          pnpm --filter aquila-pro-school-os run build:renderer
        env:
          NODE_ENV: production
