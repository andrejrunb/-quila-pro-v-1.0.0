name: Áquila Pro Sovereign CI

on:
  push:
    branches: [main, master, "integration/**"]
  pull_request:
    branches: [main, master, "integration/**"]

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Security Audit & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Strict Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security Audit (High & Critical Vulnerabilities)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint Web Portal (@aquila/web)
        run: pnpm --filter @aquila/web run lint

      - name: Typecheck Web, Shared API & Electron Desktop
        run: |
          pnpm --filter @aquila/web exec tsc --noEmit
          pnpm --filter @aquila/api exec tsc --noEmit
          pnpm --filter aquila-pro-school-os exec tsc --project tsconfig.json --noEmit

      - name: Unit Tests — Web Portal (@aquila/web)
        run: pnpm --filter @aquila/web run test

      - name: Unit Tests — Shared API (@aquila/api)
        run: pnpm --filter @aquila/api run test

      - name: E0/E1 Sovereign Orchestrator (Durable LangGraph Suite)
        run: |
          python3 -m unittest tests/orchestrator/test_e0_e1_orchestrator.py

      - name: H-01 Collector & Mission Verification
        run: |
          python3 scripts/h01/test_collector_10_fixtures.py
          python3 scripts/colab_harness/test_colab_harness.py
          node scripts/h01/test_pp_mission_verification.cjs
