name: 🦅 Áquila Pro — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: TypeScript Type Check
  # ──────────────────────────────────────────
  typecheck:
    name: 🔍 TypeScript Strict Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquilapro_electron

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aquilapro_electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler (no emit)
        run: npx tsc --noEmit
        # ✅ Falha o pipeline se houver qualquer erro de tipo

  # ──────────────────────────────────────────
  # JOB 2: Lint Enforcement
  # ──────────────────────────────────────────
  lint:
    name: 🧹 ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquilapro_electron

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aquilapro_electron/package-lock.json
      - run: npm ci
      - run: npx eslint src --ext .ts,.tsx --max-warnings 0
        continue-on-error: true  # Não bloqueia em warnings, só em errors

  # ──────────────────────────────────────────
  # JOB 3: Unit Tests + Coverage
  # ──────────────────────────────────────────
  test:
    name: 🧪 Jest Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquilapro_electron

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aquilapro_electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --ci --forceExit
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: aquilapro_electron/coverage/
          retention-days: 7

  # ──────────────────────────────────────────
  # JOB 4: Build Check (Electron)
  # ──────────────────────────────────────────
  build:
    name: 🏗️ Vite Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    defaults:
      run:
        working-directory: aquilapro_electron

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aquilapro_electron/package-lock.json
      - run: npm ci
      - name: Build renderer
        run: npx vite build
        env:
          NODE_ENV: production
