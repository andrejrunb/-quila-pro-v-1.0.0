name: 🦅 Áquila Pro — Sovereign Monorepo CI/CD

on:
  push:
    branches: [main, clean-release-v1]
  pull_request:
    branches: [main, clean-release-v1]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Security & Secrets Scan
  # ──────────────────────────────────────────
  security-audit:
    name: Security and Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Leaked Secrets
        run: |
          echo "Scanning for plaintext credentials and raw keys..."
          ! git grep -E "(sk_live_|AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36})" -- ':!*.example' ':!*.md' ':!colab/*' ':!scripts/protect_branches.py' ':!.github/workflows/ci.yml'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Dependency Vulnerability Audit Report
        run: |
          echo "Auditing dependencies..."
          pnpm audit --audit-level=high || echo "::warning::Audit detected transitive dependencies advisory. Logged for security triage."

  # ──────────────────────────────────────────
  # JOB 2: Monorepo Type Check & Lint
  # ──────────────────────────────────────────
  typecheck-and-lint:
    name: TypeScript Strict Check and ESLint
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Web TypeScript Strict Check
        run: pnpm --filter @aquila/web exec tsc --noEmit

      - name: Mobile TypeScript Strict Check
        run: |
          pnpm --filter aquila-pro-mobile exec tsc --noEmit
          pnpm --filter aquila-pro-school-os exec tsc --project tsconfig.json --noEmit

  # ──────────────────────────────────────────
  # JOB 3: Unit Tests, Security & LGPD Integrity
  # ──────────────────────────────────────────
  test:
    name: Automated Test Suite and LGPD Integrity
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Web Crypto HMAC-SHA256 Security Suite
        run: pnpm dlx tsx scripts/test_session_security.ts

      - name: Run LGPD Student Rights Test Suite (Art. 14, 16, 18)
        run: pnpm dlx tsx scripts/test_lgpd_rights.ts

      - name: Run OMR Calibration & Accuracy Benchmark
        run: pnpm dlx tsx scripts/test_omr_calibration.ts

      - name: Run SQLite Edge Backup & DR Security Suite
        run: pnpm --filter aquila-pro-school-os exec node ../../scripts/test_backup_dr_suite.cjs

      - name: Run E2E Critical Operational Flows Suite
        run: pnpm --filter aquila-pro-school-os exec node ../../scripts/test_e2e_critical_flow.cjs

      - name: Run Electron Jest Test Suite
        run: pnpm --filter aquila-pro-school-os exec jest src/__tests__/AgentControlPlaneAndRouteRegistry.test.ts src/__tests__/PilotControlPlaneLifecycle.test.ts --forceExit

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            docs/architecture/omr_calibration_report.md
            apps/electron/e2e/results.json
            test-results/e2e-critical-report.json
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # JOB 4: Monorepo Build Verification
  # ──────────────────────────────────────────
  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web SaaS & Electron Renderer
        run: |
          pnpm --filter @aquila/web run build
          pnpm --filter aquila-pro-school-os run build:renderer
        env:
          NODE_ENV: production
